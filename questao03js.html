<!DOCTYPE html>
<html>
<head>
    <title>Conversão Fahrenheit para Celsius</title>

    <script type="text/javascript">

        // Entrada de dados
        let fahrenheit = prompt("Digite a temperatura em Fahrenheit:");

        // Conversão para Celsius
        let celsius = (fahrenheit - 32) * 5/9;

        // Exibição do resultado
        alert("Temperatura em Celsius: " + celsius + "°C");

        console.log("Temperatura em Celsius: " + celsius + "°C");

    </script>

</head>
<body>

</body>
</html>
