<!DOCTYPE html>
<html>
<head>
    <title>Par ou Ímpar</title>

    <script type="text/javascript">

        // Solicita um número inteiro
        let N = parseInt(
            prompt("Digite um número inteiro:")
        );

        // Verifica se é par ou ímpar
        if (N % 2 == 0) {
            alert(N + " é par.");
            console.log(N + " é par.");
        } else {
            alert(N + " é ímpar.");
            console.log(N + " é ímpar.");
        }

    </script>

</head>
<body>

</body>
</html>
