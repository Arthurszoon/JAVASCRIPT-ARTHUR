<!DOCTYPE html>
<html>
<head>
    <title>Conversão Celsius para Fahrenheit</title>

    <script type="text/javascript">

        // Entrada de dados
        let celsius = prompt("Digite a temperatura em Celsius:");

        // Conversão para Fahrenheit
        let fahrenheit = (celsius * 9/5) + 32;

        // Exibição do resultado
        alert("Temperatura em Fahrenheit: " + fahrenheit + "°F");

        console.log("Temperatura em Fahrenheit: " + fahrenheit + "°F");

    </script>

</head>
<body>

</body>
</html>
