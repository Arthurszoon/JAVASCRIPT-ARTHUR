<!DOCTYPE html>
<html>
<head>
    <title>Cálculo Fatorial</title>

    <script type="text/javascript">

        // Solicita um número inteiro
        let N = parseInt(
            prompt("Digite um número inteiro:")
        );

        let fatorial = 1;

        // Calcula o fatorial
        for (let i = 1; i <= N; i++) {
            fatorial *= i;
        }

        // Exibe o resultado
        alert("O fatorial de " + N + " é: " + fatorial);

        console.log(
            "O fatorial de " + N + " é: " + fatorial
        );

    </script>

</head>
<body>

</body>
</html>
