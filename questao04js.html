<!DOCTYPE html>
<html>
<head>
    <title>Conversor de Temperatura</title>

    <script type="text/javascript">

        // Solicita a temperatura
        let temperatura = parseFloat(
            prompt("Digite a temperatura:")
        );

        // Solicita o tipo de conversão
        let conversao = prompt(
            "Digite a conversão desejada:\n" +
            "C = Converter para Celsius\n" +
            "F = Converter para Fahrenheit"
        );

        let resultado;

        // Verifica a conversão escolhida
        if (conversao.toUpperCase() == "F") {

            // Celsius para Fahrenheit
            resultado = (temperatura * 9/5) + 32;

            alert(
                temperatura + "°C equivalem a " +
                resultado + "°F"
            );

        } else if (conversao.toUpperCase() == "C") {

            // Fahrenheit para Celsius
            resultado = (temperatura - 32) * 5/9;

            alert(
                temperatura + "°F equivalem a " +
                resultado + "°C"
            );

        } else {

            alert("Opção inválida!");

        }

    </script>

</head>
<body>

</body>
</html>
